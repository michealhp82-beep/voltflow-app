<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VoltFlow - Field Jobcards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

  <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center space-x-2">
      <div class="bg-emerald-500 text-white p-2 rounded-lg shadow-sm">
        <i data-lucide="zap" class="w-5 h-5"></i>
      </div>
      <span class="text-xl font-bold text-slate-900 tracking-tight">VoltFlow</span>
    </div>
    
    <div class="flex items-center space-x-3">
      <button class="flex items-center space-x-2 bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-emerald-600 transition shadow-sm">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Dashboard</span>
      </button>
      <button onclick="toggleModal(true)" class="flex items-center space-x-1 text-slate-600 hover:text-slate-900 text-sm font-medium border border-slate-200 px-3 py-2 rounded-lg hover:bg-slate-50 transition">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span class="hidden sm:inline">New Job</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-8 py-8">
    
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <div>
        <h1 class="text-3xl font-bold text-slate-900">Jobs</h1>
        <p id="jobStats" class="text-slate-500 text-sm mt-1">0 active &middot; 0 completed</p>
      </div>
      <button onclick="toggleModal(true)" class="w-full sm:w-auto flex items-center justify-center space-x-2 bg-emerald-500 text-white px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-emerald-600 transition shadow-sm">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Create Jobcard</span>
      </button>
    </div>

    <div class="flex items-center space-x-2 sm:space-x-6 border-b border-slate-200 pb-3 mb-8 overflow-x-auto">
      <button class="bg-emerald-500 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">Active</button>
      <button class="text-slate-500 hover:text-slate-800 text-sm font-medium whitespace-nowrap">Completed</button>
      <button class="text-slate-500 hover:text-slate-800 text-sm font-medium whitespace-nowrap">All</button>
      <button class="flex items-center space-x-1 text-slate-500 hover:text-slate-800 text-sm font-medium whitespace-nowrap">
        <i data-lucide="calendar" class="w-4 h-4"></i>
        <span>Calendar</span>
      </button>
    </div>

    <div id="jobGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
  </main>

  <div id="jobModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-5 border-b pb-3">
        <h2 class="text-xl font-bold text-slate-900">New Field Jobcard</h2>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <form id="jobForm" onsubmit="saveJobcard(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Job Title</label>
          <input type="text" id="jobTitle" placeholder="e.g. Geyser Element Replacement" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Client Name</label>
            <input type="text" id="clientName" placeholder="Client or Business Name" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Assigned Techie</label>
            <input type="text" id="assignedTech" placeholder="e.g. Mike" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Site Address</label>
          <input type="text" id="siteAddress" placeholder="Physical location / street address" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">On-Site Photos</label>
          <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-300 rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 transition relative overflow-hidden">
            <div id="uploadPrompt" class="flex flex-col items-center justify-center pt-5 pb-6">
              <i data-lucide="camera" class="w-8 h-8 text-slate-400 mb-1"></i>
              <p class="text-xs text-slate-500"><span class="font-semibold text-emerald-600">Tap to take photo</span> or upload</p>
            </div>
            <img id="photoPreview" class="hidden absolute inset-0 w-full h-full object-cover rounded-lg" />
            <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" onchange="previewPhoto(event)" />
          </label>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Work Notes / Fault Description</label>
          <textarea id="workNotes" rows="3" placeholder="Enter findings, materials used, or work details..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
        </div>

        <div class="pt-3 flex justify-end space-x-3">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-emerald-500 text-white rounded-lg text-sm font-medium hover:bg-emerald-600 shadow-sm">Save Jobcard</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentPhotoBase64 = "";

     document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      renderJobs();
    });

    function toggleModal(show) {
      const modal = document.getElementById('jobModal');
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        resetForm();
      }
    }

    function previewPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentPhotoBase64 = e.target.result;
          const preview = document.getElementById('photoPreview');
          const prompt = document.getElementById('uploadPrompt');
          preview.src = currentPhotoBase64;
          preview.classList.remove('hidden');
          prompt.classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    function resetForm() {
      document.getElementById('jobForm').reset();
      document.getElementById('photoPreview').classList.add('hidden');
      document.getElementById('uploadPrompt').classList.remove('hidden');
      currentPhotoBase64 = "";
    }

    function saveJobcard(e) {
      e.preventDefault();
      
      const newJob = {
        id: Date.now(),
        title: document.getElementById('jobTitle').value,
        client: document.getElementById('clientName').value,
        techie: document.getElementById('assignedTech').value || 'Unassigned',
        address: document.getElementById('siteAddress').value || 'No address specified',
        notes: document.getElementById('workNotes').value,
        photo: currentPhotoBase64,
        status: 'to-start',
        date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
      };

      const jobs = JSON.parse(localStorage.getItem('voltflow_jobs') || '[]');
      jobs.push(newJob);
      localStorage.setItem('voltflow_jobs', JSON.stringify(jobs));

      toggleModal(false);
      renderJobs();
    }

    function deleteJob(id) {
      let jobs = JSON.parse(localStorage.getItem('voltflow_jobs') || '[]');
      jobs = jobs.filter(j => j.id !== id);
      localStorage.setItem('voltflow_jobs', JSON.stringify(jobs));
      renderJobs();
    }

     function renderJobs() {
      const jobs = JSON.parse(localStorage.getItem('voltflow_jobs') || '[]');
      const grid = document.getElementById('jobGrid');
      const stats = document.getElementById('jobStats');

      const activeCount = jobs.filter(j => j.status !== 'completed').length;
      const completedCount = jobs.filter(j => j.status === 'completed').length;
      stats.innerHTML = `${activeCount} active &middot; ${completedCount} completed`;

      if (jobs.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 border-2 border-dashed border-slate-200 rounded-xl bg-white">
            <i data-lucide="clipboard-list" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
            <h3 class="font-bold text-slate-700 text-lg">No Jobcards Yet</h3>
            <p class="text-slate-400 text-sm mb-4">Tap "Create Jobcard" to start recording work on site.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = jobs.map(job => `
        <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            ${job.photo ? `<img src="${job.photo}" class="w-full h-36 object-cover rounded-lg mb-3 border" />` : ''}
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-slate-900 text-lg">${job.title}</h3>
              <button onclick="deleteJob(${job.id})" class="text-slate-400 hover:text-red-500">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="space-y-1.5 text-slate-500 text-sm mb-3">
              <div class="flex items-center space-x-2">
                <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                <span>${job.client} (Techie: ${job.techie})</span>
              </div>
              <div class="flex items-center space-x-2">
                <i data-lucide="map-pin" class="w-4 h-4 text-slate-400"></i>
                <span>${job.address}</span>
              </div>
              <div class="flex items-center space-x-2">
                <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
                <span class="font-medium text-slate-700">${job.date}</span>
              </div>
            </div>

            ${job.notes ? `<p class="text-xs bg-slate-50 p-2.5 rounded-lg border text-slate-600 mb-3">${job.notes}</p>` : ''}
          </div>

          <div class="relative mt-2">
            <select class="w-full bg-slate-100 border border-slate-200 text-slate-700 text-sm font-medium rounded-lg px-3 py-2 appearance-none cursor-pointer focus:ring-2 focus:ring-emerald-500">
              <option value="planned" ${job.status === 'planned' ? 'selected' : ''}>📅 Planned</option>
              <option value="to-start" ${job.status === 'to-start' ? 'selected' : ''}>▶️ To Start</option>
              <option value="in-progress" ${job.status === 'in-progress' ? 'selected' : ''}>⚡ In Progress</option>
              <option value="testing" ${job.status === 'testing' ? 'selected' : ''}>🔍 Testing</option>
              <option value="awaiting-sign-off" ${job.status === 'awaiting-sign-off' ? 'selected' : ''}>✍️ Awaiting Sign-off</option>
              <option value="completed" ${job.status === 'completed' ? 'selected' : ''}>✅ Completed</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
              <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </div>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }
  </script>
</body>
</html>
