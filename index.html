<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VoltFlow - Field Jobcards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

  <header class="bg-white border-b border-slate-200 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center space-x-2">
      <div class="bg-emerald-500 text-white p-2 rounded-lg shadow-sm">
        <i data-lucide="zap" class="w-5 h-5"></i>
      </div>
      <span class="text-xl font-bold text-slate-900 tracking-tight">VoltFlow</span>
    </div>
    
    <div class="flex items-center space-x-3">
      <button class="flex items-center space-x-2 bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-emerald-600 transition shadow-sm">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Dashboard</span>
      </button>
      <button onclick="toggleModal(true)" class="flex items-center space-x-1 text-slate-600 hover:text-slate-900 text-sm font-medium border border-slate-200 px-3 py-2 rounded-lg hover:bg-slate-50 transition">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span class="hidden sm:inline">New Job</span>
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-8 py-8">
    
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <div>
        <h1 class="text-3xl font-bold text-slate-900">Jobs</h1>
        <p class="text-slate-500 text-sm mt-1">1 active &middot; 0 completed</p>
      </div>
      <button onclick="toggleModal(true)" class="w-full sm:w-auto flex items-center justify-center space-x-2 bg-emerald-500 text-white px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-emerald-600 transition shadow-sm">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Create Jobcard</span>
      </button>
    </div>

    <div class="flex items-center space-x-2 sm:space-x-6 border-b border-slate-200 pb-3 mb-8 overflow-x-auto">
      <button class="bg-emerald-500 text-white px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">Active (1)</button>
      <button class="text-slate-500 hover:text-slate-800 text-sm font-medium whitespace-nowrap">Completed (0)</button>
      <button class="text-slate-500 hover:text-slate-800 text-sm font-medium whitespace-nowrap">All (1)</button>
      <button class="flex items-center space-x-1 text-slate-500 hover:text-slate-800 text-sm font-medium whitespace-nowrap">
        <i data-lucide="calendar" class="w-4 h-4"></i>
        <span>Calendar</span>
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      
      <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start mb-3">
            <h3 class="font-bold text-slate-900 text-lg">DB Board Upgrade</h3>
            <div class="flex items-center space-x-2 text-slate-400">
              <button class="hover:text-slate-600"><i data-lucide="pencil" class="w-4 h-4"></i></button>
              <button class="hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </div>

          <div class="space-y-2 text-slate-500 text-sm mb-4">
            <div class="flex items-center space-x-2">
              <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
              <span>Micheal</span>
            </div>
            <div class="flex items-center space-x-2">
              <i data-lucide="map-pin" class="w-4 h-4 text-slate-400"></i>
              <span>123 some street Monzo 3935</span>
            </div>
            <div class="flex items-center space-x-2">
              <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
              <span class="font-medium text-slate-700">01 Aug 2026</span>
            </div>
          </div>
        </div>

        <div class="relative mt-2">
          <select class="w-full bg-slate-100 border border-slate-200 text-slate-700 text-sm font-medium rounded-lg px-3 py-2 appearance-none cursor-pointer focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <option value="planned">📅 Planned</option>
            <option value="to-start" selected>▶️ To Start</option>
            <option value="in-progress">⚡ In Progress</option>
            <option value="testing">🔍 Testing</option>
            <option value="awaiting-sign-off">✍️ Awaiting Sign-off</option>
            <option value="completed">✅ Completed</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
            <i data-lucide="chevron-down" class="w-4 h-4"></i>
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="jobModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-5 border-b pb-3">
        <h2 class="text-xl font-bold text-slate-900">New Field Jobcard</h2>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <form onsubmit="event.preventDefault(); toggleModal(false);" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Job Title</label>
          <input type="text" placeholder="e.g. Geyser Element Replacement" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Client Name</label>
            <input type="text" placeholder="Client or Business Name" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" required />
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Assigned Techie</label>
            <input type="text" placeholder="e.g. Mike" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Site Address</label>
          <input type="text" placeholder="Physical location / street address" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

          <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">On-Site Photos (Before / After)</label>
          <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-slate-300 rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <i data-lucide="camera" class="w-8 h-8 text-slate-400 mb-1"></i>
              <p class="text-xs text-slate-500"><span class="font-semibold text-emerald-600">Tap to take photo</span> or upload file</p>
            </div>
            <input type="file" accept="image/*" capture="environment" class="hidden" multiple />
          </label>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Work Notes / Fault Description</label>
          <textarea rows="3" placeholder="Enter findings, materials used, or work details..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
        </div>

        <div class="pt-3 flex justify-end space-x-3">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-emerald-500 text-white rounded-lg text-sm font-medium hover:bg-emerald-600 shadow-sm">Save Jobcard</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function toggleModal(show) {
      const modal = document.getElementById('jobModal');
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }
  </script>
</body>
</html>
